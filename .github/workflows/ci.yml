name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: gh pr diff "$PR_NUMBER" > pr.diff
      - run: node scripts/ask-ai.mjs ai/review.md README.md pr.diff > review.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: gh pr comment "$PR_NUMBER" --body-file review.md

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendlane
          POSTGRES_PASSWORD: spendlane
          POSTGRES_DB: spendlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendlane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spendlane:spendlane@localhost:5432/spendlane_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:server
